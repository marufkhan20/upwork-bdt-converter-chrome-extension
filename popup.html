<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Upwork BDT</h1>
      <p class="subtitle">Earnings Converter</p>
    </header>

    <div class="input-group">
      <label for="rate">USD to BDT Rate</label>
      <div class="input-wrapper">
        <span class="prefix">৳</span>
        <input type="number" id="rate" placeholder="e.g. 120" step="0.1">
      </div>
    </div>

    <div class="input-group">
      <label for="fee">Minus Fee (%)</label>
      <div class="input-wrapper">
        <input type="number" id="fee" placeholder="e.g. 15" step="0.5">
        <span class="suffix">%</span>
      </div>
    </div>

    <button id="save" class="btn-primary">Save Settings</button>
    <div id="status" class="status-msg"></div>

    <footer>
      <p>Calculated as: (USD × Rate) - Fee%</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
